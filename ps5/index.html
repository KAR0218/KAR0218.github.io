<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS5 Web Portal</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

body{
    padding:28px 24px 40px
}

.page{
    max-width:1100px;
    margin:0 auto
}

.url-bar{
    background:#111722;
    border:1px solid #26344a;
    border-radius:16px;
    padding:14px;
    box-shadow:0 0 24px rgba(0,70,160,.12)
	align-items:center;
}

#url_form{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap
}

#link{
    flex:1;
    min-width:260px;
    height:48px;
    padding:0 18px;
    border-radius:12px;
    border:1px solid #344765;
    outline:none;
    background:#080c13;
    color:#fff;
    font-size:16px
}

#link:focus{
    border-color:#245b9e;
    box-shadow:0 0 0 2px rgba(36,91,158,.22)
}

.btn{
    border:1px solid #245b9e;
    background:#12345d;
    color:#fff;
    border-radius:12px;
    min-height:48px;
    padding:0 24px;
    font-weight:700;
    cursor:pointer
}

.btn:hover,
.btn:focus{
    background:#194879;
    border-color:#3777bd
}

.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap
}

.actions .btn{
    min-width:110px
}

.nav{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:24px 0
}

.nav button{
    background:#101a28;
    border:1px solid #23466e;
    color:#dcecff;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:600
}

.nav button:hover{
    background:#163452;
    border-color:#3777bd
}

.card{
    background:#0d121b;
    border:1px solid #1e2c40;
    border-radius:18px;
    padding:28px
}

h1{
    margin:0 0 10px;
    color:#5d9fe8;
    font-size:32px
}

p{
    color:#b8c4d3;
    line-height:1.6
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:8px 13px;
    border-radius:999px;
    background:#102a47;
    border:1px solid #245b9e;
    color:#a9d1ff;
    font-size:13px
}

#msgs{
    margin-top:12px;
    color:#8ea7c2;
    font-size:13px;
    min-height:20px
}

#saved_info{
    margin-top:8px;
    color:#8ea7c2;
    font-size:13px;
    word-break:break-all
}

@media(max-width:650px){
    #url_form{
        flex-direction:column;
        align-items:stretch
    }

    #link,
    .btn{
        width:100%
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr
    }
}
</style>
</head>

<body>

<div class="page">
<br>
    <div class="url-bar">
        <form id="url_form" onsubmit="return false;">

            <input
                id="link"
                class="form-control"
                type="text"
                placeholder="Url"
                autocomplete="on"
                value="www.google.com"
            required>

            <button
                class="btn"
                type="button"
                onclick="load_full(); return false;">
                GO
            </button>

        </form>

        <div class="actions">

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='If your host is http write your host address without http and index in URL and then click here'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_link(); return false;">
                Load
            </button>

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='Save your Host address'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_save(); return false;">
                SAVE
            </button>

        </div>

        <div id="msgs">PS5 Web Portal</div>
        <div id="saved_info">No saved address yet.</div>

    </div>


    <div class="nav">
		<button
            type="button"
            onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/poopspl';">
            7.00-12.00
        </button>
		
		<button
            type="button"
            onclick="document.getElementById('link').value='https://es7in1.site//';">
            ECHO STRETCH
        </button>
        <button
            type="button"
            onclick="document.getElementById('link').value='https://www.youtube.com/';">
            YouTube
        </button>

        <button
            type="button"
            onclick="document.getElementById('link').value='https://www.google.com/';">
            Google
        </button>


    </div>


    <main class="card">

        <h1>PS5 Web Portal</h1>

        <p>
            Dark theme with URL navigation, SAVE,
            HTTP, HTTPS and full URL support.
        </p>

        <span class="status">
            READY
        </span>

    </main>

</div>


<script>

/*
 * ORIGINAL URL SAVE / LOAD LOGIC
 * kept from the original website code.
 */

function load_save(){

    var karo = document.getElementById('link').value.trim();

    if(!karo){
        document.getElementById('msgs').innerHTML =
            "Enter a URL first.";
        return;
    }

    localStorage.setItem("url", karo);

    document.getElementById('saved_info').innerHTML =
        "Saved: " + karo;
}


function load_link(){

    var url = localStorage.getItem("url");

    if(!url){
        document.getElementById('msgs').innerHTML =
            "No saved URL.";
        return;
    }

    window.location.href = "http://" + url + "/";
}


function load_full(){

    var url = document.getElementById('link').value.trim();

    if(!url){
        document.getElementById('msgs').innerHTML =
            "Enter a URL first.";
        return;
    }

    /*
     * If the user did not specify a protocol,
     * use https://
     */
    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    window.location.href = url;
}


/*
 * Show previously saved value without
 * changing the original storage logic.
 */
(function(){

    var saved = localStorage.getItem("url");

    if(saved){

        document.getElementById('saved_info').innerHTML =
            "Saved: " + saved;

    }

})();

document.addEventListener('DOMContentLoaded', () => {

    document.getElementById("url_form").addEventListener("submit", function(e) {

        e.preventDefault();

        const url = document.getElementById("url_input").value;

        if (url) {
            window.location.href = url;
        }

    });

});
</script>

</body>
</html>
