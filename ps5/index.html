<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS5 Web Portal</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

body{
    padding:28px 24px 40px
}

.page{
    max-width:1100px;
    margin:0 auto
}

.url-bar{
    background:#111722;
    border:1px solid #26344a;
    border-radius:16px;
    padding:14px;
    box-shadow:0 0 24px rgba(0,70,160,.12)
	align-items:center;
}

#url_form{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap
}

#link{
    flex:1;
    min-width:260px;
    height:48px;
    padding:0 18px;
    border-radius:12px;
    border:1px solid #344765;
    outline:none;
    background:#080c13;
    color:#fff;
    font-size:16px
}

#link:focus{
    border-color:#245b9e;
    box-shadow:0 0 0 2px rgba(36,91,158,.22)
}

.btn{
    border:1px solid #245b9e;
    background:#12345d;
    color:#fff;
    border-radius:12px;
    min-height:48px;
    padding:0 24px;
    font-weight:700;
    cursor:pointer
}

.btn:hover,
.btn:focus{
    background:#194879;
    border-color:#3777bd
}

.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap
}

.actions .btn{
    min-width:110px
}

.nav{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:24px 0
}

.nav button{
    background:#101a28;
    border:1px solid #23466e;
    color:#dcecff;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:600
}

.nav button:hover{
    background:#163452;
    border-color:#3777bd
}

.card{
    background:#0d121b;
    border:1px solid #1e2c40;
    border-radius:18px;
    padding:28px
}

h1{
    margin:0 0 10px;
    color:#5d9fe8;
    font-size:32px
}

p{
    color:#b8c4d3;
    line-height:1.6
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:8px 13px;
    border-radius:999px;
    background:#102a47;
    border:1px solid #245b9e;
    color:#a9d1ff;
    font-size:13px
}

#msgs{
    margin-top:12px;
    color:#8ea7c2;
    font-size:13px;
    min-height:20px
}

#saved_info{
    margin-top:8px;
    color:#8ea7c2;
    font-size:13px;
    word-break:break-all
}

@media(max-width:650px){
    #url_form{
        flex-direction:column;
        align-items:stretch
    }

    #link,
    .btn{
        width:100%
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr
    }
}
</style>
</head>

<body>

<div class="page">
<br>
    <div class="url-bar">
        <form id="url_form" onsubmit="return false;">

            <input
                id="link"
                class="form-control"
                type="text"
                placeholder="Url"
                autocomplete="on"
                value="www.google.com"
            required>

            <button
                class="btn"
                type="button"
                onclick="load_full(); return false;">
                GO
            </button>

        </form>

        <div class="actions">

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='If your host is http write your host address without http and index in URL and then click here'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_link(); return false;">
                Load
            </button>

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='Save your Host address'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_save(); return false;">
                SAVE
            </button>

        </div>

        <div id="msgs">PS5 Web Portal</div>
        <div id="saved_info">No saved address yet.</div>

    </div>


    <div class="nav">
		<button
            type="button"
            onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/UMTX';">
            1.00-5.XX
        </button>
		<button
            type="button"
            onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/poopspl';">
            7.00-12.00
        </button>
		<button
            type="button"
            onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/P2JB';">
            12.00-12.70
        </button>
		<button
            type="button"
            onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/relapse';">
            7.00-13.60
        </button>
		<button
            type="button"
            onclick="document.getElementById('link').value='https://es7in1.site//';">
            ECHO STRETCH
        </button>
        <button
            type="button"
            onclick="document.getElementById('link').value='https://www.youtube.com/';">
            YouTube
        </button>

        <button
            type="button"
            onclick="document.getElementById('link').value='https://www.google.com/';">
            Google
        </button>


    </div>


    <main class="card">

        <h1>PS5 Web Portal</h1>

        <p>
            Dark theme with URL navigation, SAVE,
            HTTP, HTTPS and full URL support.
        </p>

        <span class="status">
            READY
        </span>

    </main>

</div>


<script>

/*
 * ORIGINAL URL SAVE / LOAD LOGIC
 * kept from the original website code.
 */

function load_save(){

    var karo = document.getElementById('link').value.trim();

    if(!karo){
        document.getElementById('msgs').innerHTML =
            "Enter a URL first.";
        return;
    }

    localStorage.setItem("url", karo);

    document.getElementById('saved_info').innerHTML =
        "Saved: " + karo;
}


function load_link(){

    var url = localStorage.getItem("url");

    if(!url){
        document.getElementById('msgs').innerHTML =
            "No saved URL.";
        return;
    }

    window.location.href = "http://" + url + "/";
}


function load_full(){

    var url = document.getElementById('link').value.trim();

    if(!url){
        document.getElementById('msgs').innerHTML =
            "Enter a URL first.";
        return;
    }

    /*
     * If the user did not specify a protocol,
     * use https://
     */
    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    window.location.href = url;
}


/*
 * Show previously saved value without
 * changing the original storage logic.
 */
(function(){

    var saved = localStorage.getItem("url");

    if(saved){

        document.getElementById('saved_info').innerHTML =
            "Saved: " + saved;

    }

})();

document.addEventListener('DOMContentLoaded', () => {

    document.getElementById("url_form").addEventListener("submit", function(e) {

        e.preventDefault();

        const url = document.getElementById("url_input").value;

        if (url) {
            window.location.href = url;
        }

    });

});
</script>


<style id="ps5-cache-ui">
#ps5-cache-box{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 z-index:2147483647;width:min(440px,84vw);padding:20px;
 border-radius:14px;background:rgba(12,16,23,.98);color:#fff;
 font:14px/1.45 Arial,Helvetica,sans-serif;
 box-shadow:0 12px 40px rgba(0,0,0,.55);display:none
}
#ps5-cache-title{font-size:17px;font-weight:700;margin-bottom:12px}
#ps5-cache-bar{height:9px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
#ps5-cache-fill{height:100%;width:0%;background:#4caf50;transition:width .12s linear}
#ps5-cache-text{margin-top:9px;color:#dcecff}
#ps5-cache-status{margin-top:7px;color:#8ea7c2;font-size:12px}
</style>

<div id="ps5-cache-box">
 <div id="ps5-cache-title">Preparing PS5 Portal cache…</div>
 <div id="ps5-cache-bar"><div id="ps5-cache-fill"></div></div>
 <div id="ps5-cache-text">Checking cache…</div>
 <div id="ps5-cache-status"></div>
</div>

<script>
(function(){
 const CACHE="ps5-portal-v2";
 const files=[
   "/ps5/",
   "/ps5/index.html",
   "/ps5/sw.js"
 ];
 const box=document.getElementById("ps5-cache-box");
 const fill=document.getElementById("ps5-cache-fill");
 const text=document.getElementById("ps5-cache-text");
 const status=document.getElementById("ps5-cache-status");

 function show(){ box.style.display="block"; }
 function setProgress(done,total,url){
   const p=total ? Math.floor(done/total*100) : 100;
   fill.style.width=p+"%";
   text.textContent="Caching: "+p+"% ("+done+"/"+total+")";
   status.textContent=url || "";
 }
 async function cachePortal(){
   if(!("caches" in window)) {
     status.textContent="Cache API not available.";
     return;
   }

   const cache=await caches.open(CACHE);
   let done=0;
   const total=files.length;

   // If already fully cached, don't show a fake download.
   let missing=[];
   for(const url of files){
     const hit=await cache.match(url);
     if(!hit) missing.push(url);
   }

   if(!missing.length){
     show();
     fill.style.width="100%";
     text.textContent="Portal cache ready — 100%";
     status.textContent="All portal files are already cached.";
     setTimeout(()=>box.style.display="none",1600);
     return;
   }

   show();
   setProgress(0,missing.length,"Starting…");

   for(const url of missing){
     try{
       const response=await fetch(url,{cache:"no-store"});
       if(!response.ok) throw new Error(response.status);
       await cache.put(url,response.clone());
     }catch(e){
       console.log("[PS5 Cache] failed:",url,e);
     }
     done++;
     setProgress(done,missing.length,url);
   }

   fill.style.width="100%";
   text.textContent="Cache complete — 100%";
   status.textContent="Portal shell cached.";
   setTimeout(()=>box.style.display="none",1800);
 }

 window.addEventListener("load",async function(){
   // Register SW first. The page-side cache progress is independent of SW messaging.
   if("serviceWorker" in navigator){
     try{
       await navigator.serviceWorker.register("/ps5/sw.js",{scope:"/ps5/"});
       console.log("[PS5 Cache] Service Worker registered.");
     }catch(e){
       console.log("[PS5 Cache] Service Worker registration failed:",e);
     }
   }
   cachePortal().catch(e=>console.log("[PS5 Cache] error:",e));
 });
})();
</script>

</body>
</html>
