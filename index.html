<script>
function showDate() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  document.getElementById('date').textContent = p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes());
}
function showGroup(id) {
  document.getElementById('main-menu').hidden = true;
  document.querySelectorAll('.group-page').forEach(el => el.hidden = true);
  document.getElementById(id).hidden = false;
  document.getElementById('msgs2').textContent = id.replace('fw-','')+' Group';
}
function showMain() {
  document.querySelectorAll('.group-page').forEach(el => el.hidden = true);
  document.getElementById('main-menu').hidden = false;
  document.getElementById('msgs2').textContent = 'Status';
}
document.addEventListener('DOMContentLoaded', () => {
  showDate();
  setInterval(showDate, 1000);

  // Show the hovered item's description in the existing Status line.
  // Event delegation also covers links inside firmware groups.
  document.addEventListener('mouseover', (event) => {
    const item = event.target.closest('[data-description]');
    if (item) {
      document.getElementById('msgs2').textContent = item.dataset.description;
    }
  });

  document.addEventListener('mouseout', (event) => {
    const item = event.target.closest('[data-description]');
    if (item && !item.contains(event.relatedTarget)) {
      document.getElementById('msgs2').textContent = 'Status';
    }
  });
});
