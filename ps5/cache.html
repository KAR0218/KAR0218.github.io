<!DOCTYPE html>
<html lang="en" manifest="portal.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Updating Portal Cache</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080b10;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(760px,100%);background:#0d121b;border:1px solid #1e2c40;border-radius:18px;padding:28px}
h1{margin:0 0 12px;color:#5d9fe8}
#status{font-weight:700;margin-top:20px}
#detail{color:#8ea7c2;margin-top:8px;font-size:13px;min-height:18px}
.bar{height:18px;background:#111722;border:1px solid #26344a;border-radius:999px;overflow:hidden;margin-top:18px}
#fill{height:100%;width:0%;background:#245b9e}
#percent{margin-top:10px;color:#a9d1ff;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>PS5 Web Portal</h1>
<div id="status">Preparing cache update...</div>
<div id="detail"></div>
<div class="bar"><div id="fill"></div></div>
<div id="percent">0%</div>
</div>
<script>
(function(){
    var app=window.applicationCache;
    var fill=document.getElementById("fill");
    var percent=document.getElementById("percent");
    var status=document.getElementById("status");
    var detail=document.getElementById("detail");

    function setProgress(p,msg,info){
        p=Math.max(0,Math.min(100,p));
        fill.style.width=p+"%";
        percent.textContent=p+"%";
        status.textContent=msg;
        detail.textContent=info||"";
    }

    if(!app){
        setProgress(0,"Application Cache unavailable","");
        return;
    }

    app.addEventListener("checking",function(){
        setProgress(0,"Checking Portal cache...","Looking for a new version");
    },false);

    app.addEventListener("downloading",function(){
        setProgress(0,"Caching Web Portal...","Downloading Portal files");
    },false);

    app.addEventListener("progress",function(e){
        var total=e.total||0;
        var loaded=e.loaded||0;
        var p=total ? Math.floor((loaded/total)*100) : 0;
        setProgress(p,"Caching: "+p+"%",loaded+" / "+total+" resources");
    },false);

    app.addEventListener("cached",function(){
        setProgress(100,"Cache complete — 100%","Opening Web Portal...");
        setTimeout(function(){ window.location.replace("index.html"); },700);
    },false);

    app.addEventListener("updateready",function(){
        setProgress(100,"Cache update complete — 100%","Opening Web Portal...");
        try { app.swapCache(); } catch(e) {}
        setTimeout(function(){ window.location.replace("index.html"); },700);
    },false);

    app.addEventListener("noupdate",function(){
        setProgress(100,"Portal cache is up to date — 100%","Opening Web Portal...");
        setTimeout(function(){ window.location.replace("index.html"); },700);
    },false);

    app.addEventListener("error",function(){
        setProgress(100,"Using existing Portal cache","Offline / no update available");
        setTimeout(function(){ window.location.replace("index.html"); },700);
    },false);

    /*
     * When opened from UPDATE CACHE, force an AppCache check
     * after all event listeners are ready.
     */
    if(window.location.search.indexOf("update=1") !== -1){
        setTimeout(function(){
            try {
                app.update();
            } catch(e) {}
        },300);
    }
})();
</script>
</body>
</html>
