<!DOCTYPE html>
<html lang="en" manifest="relapse.manifest">
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps5 — Cache</title>
<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0c0c0f;
    color:#dfe3ee;
    font:12px/1.45 ui-monospace,Consolas,monospace;
}
body{
    box-sizing:border-box;
    min-height:100vh;
    padding:10px 12px;
    overflow:hidden;
}
#console{
    min-height:100%;
    box-sizing:border-box;
}
.line{padding:1px 0}
.info{color:#b9c2ff}
.debug{color:#6f7480}
.success{color:#7dff9e}
.warn{color:#ffd27d}
.error{color:#ff6b6b}
.progress{
    margin-top:12px;
    height:16px;
    border:1px solid #30333b;
    background:#16171b;
    border-radius:3px;
    overflow:hidden;
}
#fill{
    width:0%;
    height:100%;
    background:#7dff9e;
}
#percent{
    margin-top:5px;
    color:#b9c2ff;
}
</style>
</head>
<body>
<div id="console">
    <div class="line info">PS5 RELAPSE</div>
    <div class="line">Application Cache</div>
    <div id="status" class="line">Preparing cache...</div>
    <div id="detail" class="line debug"></div>
    <div class="progress"><div id="fill"></div></div>
    <div id="percent">0%</div>
</div>

<script>
(function(){
    var app=window.applicationCache;
    var fill=document.getElementById("fill");
    var percent=document.getElementById("percent");
    var status=document.getElementById("status");
    var detail=document.getElementById("detail");

    function setProgress(p,msg,info,cls){
        p=Math.max(0,Math.min(100,p));
        fill.style.width=p+"%";
        percent.textContent=p+"%";
        status.textContent=msg;
        detail.textContent=info||"";
        status.className="line "+(cls||"info");
    }

    if(!app){
        setProgress(0,"Application Cache unavailable","", "error");
        return;
    }

    app.addEventListener("checking",function(){
        setProgress(0,"Checking Relapse cache...","Looking for a new version","info");
    },false);

    app.addEventListener("downloading",function(){
        setProgress(0,"Caching Relapse...","Downloading local Relapse files","info");
    },false);

    app.addEventListener("progress",function(e){
        var total=e.total||0;
        var loaded=e.loaded||0;
        var p=total ? Math.floor((loaded/total)*100) : 0;
        setProgress(p,"Caching: "+p+"%",loaded+" / "+total+" resources","info");
    },false);

    app.addEventListener("cached",function(){
        setProgress(100,"Cache complete — 100%","Opening Relapse...","success");
        setTimeout(function(){window.location.replace("index.html");},700);
    },false);

    app.addEventListener("updateready",function(){
        setProgress(100,"Cache update complete — 100%","Opening Relapse...","success");
        try{app.swapCache();}catch(e){}
        setTimeout(function(){window.location.replace("index.html");},700);
    },false);

    app.addEventListener("noupdate",function(){
        setProgress(100,"Relapse cache is up to date — 100%","Opening Relapse...","success");
        setTimeout(function(){window.location.replace("index.html");},700);
    },false);

    app.addEventListener("error",function(){
        setProgress(100,"Using existing Relapse cache","Offline / no update available","warn");
        setTimeout(function(){window.location.replace("index.html");},700);
    },false);

    if(window.location.search.indexOf("update=1") !== -1){
        setTimeout(function(){
            try{app.update();}catch(e){}
        },300);
    }
})();
</script>
</body>
</html>
