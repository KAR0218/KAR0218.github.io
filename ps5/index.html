<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS5 Web Portal</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

body{
    padding:28px 24px 40px
}

.page{
    max-width:1100px;
    margin:0 auto
}

.url-bar{
    background:#111722;
    border:1px solid #26344a;
    border-radius:16px;
    padding:14px;
    box-shadow:0 0 24px rgba(0,70,160,.12);
    align-items:center;
}

#url_form{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap
}

#link{
    flex:1;
    min-width:260px;
    height:48px;
    padding:0 18px;
    border-radius:12px;
    border:1px solid #344765;
    outline:none;
    background:#080c13;
    color:#fff;
    font-size:16px
}

#link:focus{
    border-color:#245b9e;
    box-shadow:0 0 0 2px rgba(36,91,158,.22)
}

.btn{
    border:1px solid #245b9e;
    background:#12345d;
    color:#fff;
    border-radius:12px;
    min-height:48px;
    padding:0 24px;
    font-weight:700;
    cursor:pointer
}

.btn:hover,
.btn:focus{
    background:#194879;
    border-color:#3777bd
}

.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap
}

.actions .btn{
    min-width:110px
}

.nav{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin:24px 0;
}

.nav button{
    width:100%;
    height:48px;
    background:#101a28;
    border:1px solid #23466e;
    color:#dcecff;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:600;
    text-align:center;
}

.nav button:hover{
    background:#163452;
    border-color:#3777bd
}

/* Dedicated Wobkot entry */
.nav button.wobkot{
    grid-column:1 / -1;
    height:76px;
    background:#174d36;
    border:1px solid #35a66f;
    color:#e5fff1;
    font-size:18px;
    font-weight:700;
    line-height:1.35;
}
.nav button.wobkot small{
    display:block;
    margin-top:3px;
    color:#b9e8cf;
    font-size:12px;
    font-weight:500;
}
.nav button.wobkot:hover{
    background:#206b49;
    border-color:#58ce91;
}

.card{
    background:#0d121b;
    border:1px solid #1e2c40;
    border-radius:18px;
    padding:28px
}

h1{
    margin:0 0 10px;
    color:#5d9fe8;
    font-size:32px
}

p{
    color:#b8c4d3;
    line-height:1.6
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:8px 13px;
    border-radius:999px;
    background:#102a47;
    border:1px solid #245b9e;
    color:#a9d1ff;
    font-size:13px
}
.nav > button:nth-of-type(4){
    background:#283833;
    border-color:#3777bd;
}
.nav > button:nth-of-type(5):hover{
    background:#3007bd;
    border-color:#4d8fd3;
}
.nav > button:nth-of-type(5){
    background:#2B3B36;
    border-color:#3777bd;
}
.nav > button:nth-of-type(4):hover{
    background:#3007bd;
    border-color:#4d8fd3;
}
#msgs{
    margin-top:12px;
    color:#8ea7c2;
    font-size:13px;
    min-height:20px
}

#saved_info{
    margin-top:8px;
    color:#8ea7c2;
    font-size:13px;
    word-break:break-all
}

@media(max-width:650px){
    .nav{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="page">
<br>
    <div class="url-bar">
        <form id="url_form" onsubmit="return false;">

            <input
                id="link"
                class="form-control"
                type="text"
                placeholder="Url"
                autocomplete="on"
                value="www.google.com"
            required>

            <button
                class="btn"
                type="button"
                onclick="load_full(); return false;">
                GO
            </button>

        </form>

        <div class="actions">

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='If your host is http write your host address without http and index in URL and then click here'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_link(); return false;">
                Load
            </button>

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='Save your Host address'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_save(); return false;">
                SAVE
            </button>

        </div>

        <div id="msgs">PS5 Web Portal</div>
        <div id="saved_info">No saved address yet.</div>

    </div>


    <div class="nav">
        <button
            type="button"
            class="wobkot"
            onclick="window.location.href='https://kar0218.github.io/ps5/wobkot/';">
            Wobkot Host — PS4 + PS5
            <small>PS4: 9.00–12.02 &nbsp;|&nbsp; PS5: Offset table 5.00–13.00*</small>
        </button>
		<button
            type="button"
            onclick="window.location.href='https://kar0218.github.io/ps5/UMTX/';">
            1.00-5.XX <br> (UMTX2)
        </button>
		<button
            type="button"
            onclick="window.location.href='https://kar0218.github.io/ps5/poopspl/';">
            7.00-12.00 <br> (Poopsploit)
        </button>
		<button
            type="button"
            onclick="window.location.href='https://kar0218.github.io/ps5/relapse/';">
            7.00-13.60 <br> (New Relapse)
        </button>
		<button
            type="button"  id="new-relapse"
            onclick="window.location.href='https://kar0218.github.io/ps5/pr/';">
            7.00-13.60 <br> (New Poopsploit+Relapse)
        </button>
		<button
            type="button"
            onclick="window.location.href='https://es7in1.site/';">
            ECHO STRETCH
        </button>
        <button
            type="button"
            onclick="window.location.href='https://www.youtube.com/';">
            YouTube
        </button>

        <button
            type="button"
            onclick="window.location.href='https://www.google.com/';">
            Google
        </button>
		<button
            type="button"  id="elfsender"
            onclick="window.location.href='https://kar0218.github.io/ps5/elfsender/';">
            PS5 ELF Sender <br> (Sender to Port:9021)
        </button>

    </div>
    <div style="margin:-12px 0 18px;color:#8293a8;font-size:11px;text-align:center;">
        *PS5 range indicates firmware versions represented in the offset table; the exact upper supported firmware is not yet confirmed.
    </div>


    <main class="card">

        <h1>PS5 Web Portal</h1>

        <p>
            Dark theme with URL navigation, SAVE,
            HTTP, HTTPS and full URL support.
        </p>

        <span class="status">
            READY
        </span>

    </main>

</div>


<script>

/*
 * ORIGINAL URL SAVE / LOAD LOGIC
 * kept from the original website code.
 */

function load_save(){

    var karo = document.getElementById('link').value.trim();

    if(!karo){
        document.getElementById('msgs').innerHTML =
            "Enter a URL first.";
        return;
    }

    localStorage.setItem("url", karo);

    document.getElementById('saved_info').innerHTML =
        "Saved: " + karo;
}


function load_link() {
    var url = localStorage.getItem("url");

    if (!url) {
        document.getElementById("msgs").textContent =
            "No saved URL.";
        return;
    }

    url = url.trim();

    // Add HTTP only when no protocol is specified
    if (!/^https?:\/\//i.test(url)) {
        url = "http://" + url;
    }

    // Add trailing slash only when needed
    if (!url.endsWith("/")) {
        url += "/";
    }

    window.location.href = url;
}


function load_full(){

    var url = document.getElementById('link').value.trim();

    if(!url){
        document.getElementById('msgs').innerHTML =
            "Enter a URL first.";
        return;
    }

    /*
     * If the user did not specify a protocol,
     * use https://
     */
    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    window.location.href = url;
}


/*
 * Show previously saved value without
 * changing the original storage logic.
 */
(function(){

    var saved = localStorage.getItem("url");

    if(saved){

        document.getElementById('saved_info').innerHTML =
            "Saved: " + saved;

    }

})();

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById("url_form").addEventListener("submit", function(e) {
        e.preventDefault();
        load_full();
    });
});
</script>

</body>
</html>
